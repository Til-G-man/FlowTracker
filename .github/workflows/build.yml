name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows prerelease
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller matplotlib plyer

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --hidden-import=matplotlib.backends.backend_tkagg --hidden-import=plyer.platforms.win.notification --name FlowTracker main.py

      - name: Create GitHub prerelease
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'dist/FlowTracker.exe';
            const tag = context.ref.replace('refs/tags/', '');
            const assetName = 'FlowTracker.exe';

            let release;

            try {
              release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });

              release = await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                prerelease: true,
                name: tag,
                generate_release_notes: true,
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              release = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: tag,
                prerelease: true,
                generate_release_notes: true,
              });
            }

            const existingAssets = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
            });

            for (const asset of existingAssets.data) {
              if (asset.name === assetName) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id,
                });
              }
            }

            const asset = fs.readFileSync(path);
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              name: assetName,
              data: asset,
              headers: {
                'content-type': 'application/octet-stream',
                'content-length': fs.statSync(path).size,
              },
            });