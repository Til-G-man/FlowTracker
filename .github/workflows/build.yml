name: Build and Release

on:
  push:
    tags:
      - 'v*' # Startet automatisch, sobald du ein Release-Tag (z.B. v1.0.0) auf GitHub machst

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    # Wichtig: Erlaubt der Action, die fertigen Dateien in dein Release hochzuladen
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - os: windows-latest
            output_name: FlowTracker-Windows.exe
          - os: macos-latest
            output_name: FlowTracker-Mac
          - os: ubuntu-latest
            output_name: FlowTracker-Linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller matplotlib plyer

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --hidden-import=matplotlib.backends.backend_tkagg --hidden-import=plyer.platforms.win.notification --name "${{ matrix.output_name }}" app.py

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/${{ matrix.output_name }}